# Minimal Slurm configuration for hello-world demo
# Based on Spindle's working configuration
ClusterName=hello-slurm
ControlMachine=slurm-head
ControlAddr=slurm-head
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818

# Authentication
AuthType=auth/munge

# Logging
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=3
SlurmdDebug=3

# Process tracking
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

# Scheduling
SchedulerType=sched/builtin
SelectType=select/linear

# State preservation
StateSaveLocation=/var/lib/slurmd
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/var/run/slurmd/slurmctld.pid
SlurmdPidFile=/var/run/slurmd/slurmd.pid

# Accounting (minimal - no database)
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none

# Return to service
ReturnToService=2

# MPI
MpiDefault=none

# Node definitions - explicitly set NodeAddr
NodeName=slurm-node-1 NodeAddr=slurm-node-1 CPUs=1 State=UNKNOWN
NodeName=slurm-node-2 NodeAddr=slurm-node-2 CPUs=1 State=UNKNOWN
PartitionName=debug Nodes=slurm-node-[1-2] Default=YES MaxTime=INFINITE State=UP
