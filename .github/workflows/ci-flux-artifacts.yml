name: ci-flux-artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  spindle-flux-ubuntu:
    name: Testsuite (Flux, Ubuntu)
    environment: Spindle CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Spindle
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@16feee727cbdc83b6a014e6cc26fec4a79bcf30c
        with:
          version: latest

      - name: Build spindle-flux-ubuntu image
        id: flux-ubuntu-build
        run: |
          cd containers/spindle-flux-ubuntu
          docker compose --progress=plain build

      - name: Bring spindle-flux-ubuntu up
        id: flux-ubuntu-up
        run: |
          cd containers/spindle-flux-ubuntu
          docker compose up -d --wait --wait-timeout 60

      - name: Verify munge works in spindle-flux-ubuntu
        id: flux-ubuntu-munge
        run: |
          docker exec node-1 bash -c 'munge -n | unmunge'

      - name: Run spindle-flux-ubuntu testsuite
        id: flux-ubuntu-testsuite
        run: |
          docker exec node-1 bash -c 'cd Spindle-build/testsuite && SPINDLE_DEBUG=3 flux alloc --nodes=${workers} ./runTests --nodes=${workers} --tasks-per-node=3'

      - name: Collect Spindle logs from containers
        if: ${{ always() }}
        continue-on-error: true
        run: |
          failed=0
          for node in node-1 node-2 node-3 node-4; do
            echo "::group::Collecting logs from $node"

            if ! workdir=$(docker inspect -f '{{.Config.WorkingDir}}' "$node" 2>/dev/null); then
              echo "Container $node not found; skipping."
              failed=1
              echo "::endgroup::"
              continue
            fi

            if [ -z "$workdir" ]; then
              echo "WorkingDir empty for $node; cannot resolve log path."
              failed=1
              echo "::endgroup::"
              continue
            fi

            src="$workdir/Spindle-build/testsuite"
            mkdir -p "spindle-logs/$node"

            if docker cp "$node:$src/." "spindle-logs/$node/"; then
              ls -la "spindle-logs/$node/"
            else
              echo "Copy failed for $node; listing container path:"
              docker exec "$node" ls -la "$src" || docker exec "$node" ls -la "$workdir" || true
              failed=1
              continue
            fi
            find "spindle-logs/$node/" -type f ! -name 'spindle_output.*' -delete

            echo "::endgroup::"
          done

          echo "Collected tree:"
          ls -R spindle-logs/ || true
          exit "$failed"


      - name: Upload Spindle logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: spindle-logs-flux
          path: spindle-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Bring spindle-flux-ubuntu down
        id: flux-ubuntu-down
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd containers/spindle-flux-ubuntu
          docker compose down
