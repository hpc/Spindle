name: ci-serial-arm64-artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  spindle-serial-ubuntu_arm64:
    name: Testsuite (Serial, Ubuntu, arm64)
    environment: Spindle CI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out Spindle
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@16feee727cbdc83b6a014e6cc26fec4a79bcf30c
        with:
          version: latest

      - name: Build spindle-serial-ubuntu image
        id: serial-ubuntu-build
        run: |
          cd containers/spindle-serial-ubuntu
          docker compose --progress=plain build

      - name: Bring spindle-serial-ubuntu up
        id: serial-ubuntu-up
        run: |
          cd containers/spindle-serial-ubuntu
          docker compose up -d

      - name: Verify munge works in spindle-serial-ubuntu
        id: serial-ubuntu-munge
        run: |
          docker exec spindlenode bash -c 'munge -n | unmunge'

      - name: Run spindle-serial-ubuntu testsuite
        id: serial-ubuntu-testsuite
        run: |
          docker exec spindlenode bash -c 'cd Spindle-build/testsuite && SPINDLE_DEBUG=3 ./runTests'

      - name: Collect Spindle logs from container
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p spindle-logs
          workdir=$(docker inspect -f '{{.Config.WorkingDir}}' spindlenode)
          echo "Container WorkingDir: ${workdir:-<empty>}"
          src="${workdir:?WorkingDir was empty - cannot resolve log path}/Spindle-build/testsuite"
          docker cp "spindlenode:$src/." spindle-logs/ || {
            echo "Copy failed; listing container path:"
            docker exec spindlenode ls -la "$src" || docker exec spindlenode ls -la "$workdir"
            exit 1
          }
          ls -la spindle-logs/

      - name: Upload Spindle logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: spindle-logs-serial-arm64
          path: spindle-logs/spindle_output.*
          retention-days: 7
          if-no-files-found: warn

      - name: Bring spindle-serial-ubuntu down
        id: serial-ubuntu-down
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd containers/spindle-serial-ubuntu
          docker compose down
